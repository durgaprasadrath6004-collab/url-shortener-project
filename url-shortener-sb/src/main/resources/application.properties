spring.application.name=url-shortener-sb

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/urlshortener}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=${DATABASE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

jwt.secret=${JWT_SECRET:c29tZXN1cGVyc2VjcmV0a2V5Zm9ydXJsc2hvcnRlbmVycHJvamVjdDEyMzQ1Ng==}
jwt.expiration=172800000

logging.level.org.springframework.security=INFO
logging.level.org.url.shortener=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.web.servlet=INFO

frontend.url=${FRONTEND_URL:http://localhost:5173,http://localhost:3000}
